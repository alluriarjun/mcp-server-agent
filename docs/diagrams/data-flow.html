<figcaption>
  The <strong>LLM (Claude API)</strong> is the reasoning engine shared by all agents — it decides which MCP tool to call and synthesises the final answer.<br>
  Specialized agents (Momentum, Value, Sentiment, Synthesis) live <em>inside</em> the Agent Worker as LangGraph sub-graphs. Each agent sends its own prompt + context to Claude; Claude responds with a tool call; the Agent Worker executes it against the MCP Server; the result feeds back to Claude.<br>
  Adding a new agent (e.g. a Dividend Agent) means adding a new LangGraph sub-graph — no changes to the MCP Server or Claude API wiring.<br>
  <strong>Status (2026-09-03, Week 5):</strong> this pipeline — the design-doc.md §8.2 portfolio-analysis graph — is still the target design, not yet built. The first real LangGraph agent turned out to be a different one: the watchlist-import agent below, built and validated live instead. See <a href="../roadmap-status.md">roadmap-status.md</a>.
</figcaption>
</figure>

<figcaption>
  <strong>What's actually running today</strong>, as of 2026-09-03: a second, independent MCP server (<code>stockpeek-agent-worker</code>) that Claude Desktop calls directly, running one LangGraph graph — <code>resolve</code> (the only LLM call, reads via MCP for context) → <code>apply_loop</code> (one <code>apply_watchlist_update</code> MCP call per resolved stock, no LLM) → <code>summarize</code>.<br>
  <strong>The write tool it calls, <code>apply_watchlist_update</code>, is also directly reachable by Claude Desktop's own model</strong> if left enabled in its tool picker — confirmed in practice, it will bypass <code>resolve</code> entirely for a simple request. There's no server-side fix; it's disabled client-side in Claude Desktop's per-tool toggle instead.<br>
  Validated live end-to-end (both AAPL and IONQ landed in a real "Tech Growth" watchlist for user 1) — see <a href="../roadmap-status.md">roadmap-status.md</a> for the two real bugs that surfaced along the way (a cwd-relative <code>.env</code> load, and an <code>ExceptionGroup</code> swallowing the real error).
