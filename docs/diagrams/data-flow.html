<figcaption>
  The <strong>LLM (Claude API)</strong> is the reasoning engine shared by all agents — it decides which MCP tool to call and synthesises the final answer.<br>
  Specialized agents (Momentum, Value, Sentiment, Synthesis) live <em>inside</em> the Agent Worker as LangGraph sub-graphs. Each agent sends its own prompt + context to Claude; Claude responds with a tool call; the Agent Worker executes it against the MCP Server; the result feeds back to Claude.<br>
  Adding a new agent (e.g. a Dividend Agent) means adding a new LangGraph sub-graph — no changes to the MCP Server or Claude API wiring.
</figcaption>
